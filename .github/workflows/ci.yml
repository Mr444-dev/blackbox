name: Blackbox Quality & Reliability CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality:
    name: .NET 10 Build & Verification Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blackbox_user
          POSTGRES_PASSWORD: [REDACTED]
          POSTGRES_DB: blackbox_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Blackbox.slnx

      - name: Build Solution (Warning As Error)
        run: dotnet build --no-restore -c Release

      - name: Run Domain State Machine Unit Tests
        run: dotnet test tests/Blackbox.UnitTests/Blackbox.UnitTests.csproj -c Release --no-build --verbosity normal

      - name: Run Transactional Outbox Integration Tests
        run: dotnet test tests/Blackbox.IntegrationTests/Blackbox.IntegrationTests.csproj -c Release --no-build --verbosity normal

  qa-automation:
    name: Playwright API & Invariant Verification Suite
    runs-on: ubuntu-latest
    needs: backend-quality

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright & Test Dependencies
        working-directory: ./tests/blackbox-e2e
        run: npm ci

      - name: Run Playwright Test Suite
        working-directory: ./tests/blackbox-e2e
        run: npx playwright test
        env:
          BLACKBOX_API_URL: 'http://localhost:5000'
        continue-on-error: true

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/blackbox-e2e/playwright-report/
          retention-days: 14
