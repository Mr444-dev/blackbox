name: Blackbox CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Build and .NET tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Blackbox.slnx
      - run: dotnet build Blackbox.slnx --no-restore --configuration Release --warnaserror
      - run: dotnet test tests/Blackbox.UnitTests/Blackbox.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit-tests.trx"
      - run: dotnet test tests/Blackbox.IntegrationTests/Blackbox.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=integration-tests.trx"
        env:
          BLACKBOX_TESTCONTAINERS: "true"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 14

  api-e2e:
    name: Docker Compose and Playwright API tests
    runs-on: ubuntu-24.04
    needs: backend
    env:
      BLACKBOX_API_KEY: ci-test-key-not-for-production-0123456789
      BLACKBOX_POSTGRES_PASSWORD: ci-postgres-password-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/blackbox-e2e/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start full local stack
        run: docker compose up --build --detach
      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Install Playwright dependencies
        working-directory: tests/blackbox-e2e
        run: npm ci
      - name: Type-check API test suite
        working-directory: tests/blackbox-e2e
        run: npx tsc --noEmit --pretty false
      - name: Install Chromium
        working-directory: tests/blackbox-e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright API suite
        working-directory: tests/blackbox-e2e
        run: npx playwright test
        env:
          BLACKBOX_API_URL: http://localhost:5000
          BLACKBOX_API_KEY: ci-test-key-not-for-production-0123456789
      - name: Verify Kafka Outbox and Inbox delivery
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            counts=$(docker compose exec -T postgres psql -U blackbox_user -d blackbox_db -Atc "SELECT (SELECT COUNT(*) FROM outbox_messages WHERE status = 'Published'), (SELECT COUNT(*) FROM inbox_messages);")
            published=${counts%%|*}
            inbox=${counts##*|}
            if [[ "$published" =~ ^[0-9]+$ && "$inbox" =~ ^[0-9]+$ ]] && (( published > 0 && inbox > 0 )); then
              echo "Kafka delivery verified: published=$published inbox=$inbox"
              exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color worker
          echo "Kafka Outbox/Inbox delivery was not observed."
          exit 1
      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: tests/blackbox-e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
