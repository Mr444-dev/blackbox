apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: blackbox-api-destination
  namespace: blackbox
spec:
  host: blackbox-api-service.blackbox.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 1024
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: "1.0.0"
    - name: v2
      labels:
        version: "2.0.0-canary"
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: blackbox-worker-destination
  namespace: blackbox
spec:
  host: blackbox-worker.blackbox.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
