apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: cilium
      version: "1.16.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  values:
    # 1. Zero-overhead eBPF replacement for kube-proxy
    kubeProxyReplacement: "true"
    bpf:
      masquerade: true
      tproxy: true
      autoMountLpipe: true

    # 2. Hubble eBPF Observability Engine
    hubble:
      enabled: true
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
        serviceMonitor:
          enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
