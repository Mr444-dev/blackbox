apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: blackbox-kernel-socket-tracing
  namespace: kube-system
spec:
  kprobes:
    - call: "tcp_connect"
      syscall: false
      args:
        - index: 0
          type: "sock"
      selectors:
        - matchArgs:
            - index: 0
              operator: "DPort"
              values:
                - "8080" # blackbox-api
                - "5432" # postgres
                - "9092" # kafka
          matchActions:
            - action: Sigkill
              rateLimit: "100/1s"
    - call: "tcp_close"
      syscall: false
      args:
        - index: 0
          type: "sock"
